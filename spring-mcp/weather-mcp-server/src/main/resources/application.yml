
server:
  port: 9092

spring:
  application:
    name: weather-mcp-server

  ai:
    mcp:
      server:
        name: weather-server
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC

        streamable-http:
          mcp-endpoint: /mcp

        annotation-scanner:
          enabled: true    
