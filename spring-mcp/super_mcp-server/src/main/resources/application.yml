server:
  port: 9090

spring:
  application:
    name: super_mcp-server

  ai:
    mcp:

      # ============================
      # MCP CLIENT
      # ============================

      client:
        enabled: true

        name: super-mcp-client
        version: 1.0.0

        type: SYNC
        initialized: true
        request-timeout: 40s

        toolcallback:
          enabled: true

        streamable-http:
          connections:

            calculator-server:
              url: http://localhost:9091
              endpoint: /mcp
              
            weather-server:
              url: http://localhost:9092
              endpoint: /mcp  


      # ============================
      # MCP SERVER
      # ============================

      server:
        enabled: true

        name: super-mcp-server
        version: 1.0.0

        protocol: STREAMABLE
        type: SYNC

        streamable-http:
          mcp-endpoint: /mcp
# ======================================
        # THIS MAKES IT SUPER MCP
# ======================================
        expose-mcp-client-tools: true


    openai:
     api-key: key
     base-url: https://openrouter.ai/api/v1
     chat:
      model: poolside/laguna-s-2.1:free
      options: 
        max-tokens: 300
